name: CI

on:
  push:
    branches: [node]
  pull_request:
    branches: [node]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            lib: libavjs.node
          - os: macos-latest
            target: darwin-arm64
            lib: libavjs.node
          - os: macos-15-large
            target: darwin-x64
            lib: libavjs.node
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          echo "FFmpeg installed at:"
          FFMPEG_PREFIX=$(brew --prefix ffmpeg)
          echo "FFMPEG_PREFIX=$FFMPEG_PREFIX"
          ls -la $FFMPEG_PREFIX/lib/ | head -10
          ls -la $FFMPEG_PREFIX/include/ | head -5
          # Set environment variables for the build
          echo "FFMPEG_PREFIX=$FFMPEG_PREFIX" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$FFMPEG_PREFIX/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          echo "C_INCLUDE_PATH=$FFMPEG_PREFIX/include:$C_INCLUDE_PATH" >> $GITHUB_ENV
          echo "CPATH=$FFMPEG_PREFIX/include:$CPATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          # Verify pkg-config can find ffmpeg libs
          pkg-config --libs libavcodec libavformat libavutil

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build native module (Linux)
        if: runner.os == 'Linux'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: cd native && zig build -Doptimize=ReleaseFast

      - name: Build native module (macOS)
        if: runner.os == 'macOS'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            cd native
            echo "Building with FFMPEG_PREFIX=$FFMPEG_PREFIX"
            # Pass FFmpeg prefix directly to Zig build
            zig build -Doptimize=ReleaseFast -Dffmpeg-prefix="$FFMPEG_PREFIX"

      - name: List build output
        run: |
          ls -laR native/zig-out/
          echo "=== Native module info ==="
          file native/zig-out/lib/libavjs.node || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.target }}
          path: native/zig-out/lib/${{ matrix.lib }}

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/node'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lib-linux-x64
          path: dist/linux-x64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lib-darwin-arm64
          path: dist/darwin-arm64

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lib-darwin-x64
          path: dist/darwin-x64

      - name: List artifacts
        run: ls -laR dist/

      - name: Install dependencies
        run: pnpm install

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm propagation
        run: sleep 15

      - name: Verify published package works
        run: |
          # Create a temp directory for testing
          mkdir -p /tmp/test-pkg
          cd /tmp/test-pkg
          npm init -y
          
          # Get the package name and version from the repo
          PKG_NAME=$(node -p "require('${{ github.workspace }}/package.json').name")
          PKG_VERSION=$(node -p "require('${{ github.workspace }}/package.json').version")
          
          echo "Testing $PKG_NAME@$PKG_VERSION"
          
          # Install the just-published package
          npm install "$PKG_NAME@$PKG_VERSION"
          
          # Test that it can be imported and basic functions exist
          node -e "
            const pkg = require('$PKG_NAME');
            console.log('Package loaded successfully');
            console.log('Exports:', Object.keys(pkg));
          "
          
          echo "Package verification passed!"
